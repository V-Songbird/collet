<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Seven checks from one run on Claude Opus 5.5 through the Claude Agent SDK, not a Claude Code session, on 2026-11-16, three runs with collet and three without, exploratory. Each dot is one run. Setting up a first task (mount-opens-first-task): settings filled in (config-filled), first task opened (first-task-open), harness proven by its own checks (harness-proven) and existing instructions kept (rules-block-kept-map-text) each passed 3 of 3 with collet and 0 of 3 without. Writing a new check (check-writer-admits-a-check): new check admitted (check-admitted) and cart code left untouched (cart-unchanged) each passed 3 of 3 with collet and 2 of 3 without. Guarding a file outside the task (guard-refuses-out-of-scope-write): guard refused a write (guard-refused) passed 0 of 3 with collet and is not graded without, because no run tried to write outside its task; each left the file alone and named it, so the guard had nothing to refuse. It reads: Six wins, one loss."><style>.bg{fill:#f2f1ec}.bg{stroke:rgba(20,20,19,.14)}.ink{fill:#161612}.mut{fill:#6d6a60}.wv{fill:#8f8b80}.ho{fill:none;stroke:#8f8b80}.nd{fill:#3f8f4f}.id{fill:#3f8f4f}@media(prefers-color-scheme:dark){.bg{fill:#141413}.bg{stroke:#30363d}.ink{fill:#ffffff}.mut{fill:#b9b9b1}.wv{fill:#8f8b80}.ho{fill:none;stroke:#8f8b80}.nd{fill:#8dce9a}.id{fill:#8dce9a}}.card,.bg{fill:#fff}.ink-frame{stroke:#252820;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.seal{stroke:#252820}.seal-paper{fill:#fff}text{font-kerning:normal;text-rendering:optimizeLegibility}@media(prefers-color-scheme:dark){.card,.bg{fill:#191c1b}.ink-frame{stroke:#eee9de}.seal{stroke:#eee9de}.seal-paper{fill:#191c1b}}</style><path class="bg ink-frame" d="M12 1 Q252 -2 688 1 Q699 0 699 12 L698 420 Q700 431 688 431 Q336 434 12 431 Q1 432 1 420 L2 12 Q0 1 12 1Z"/><text class="id